[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Comment functions: see netlify/functions and README > "Comments".
[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-gatsby"

# The old docroot had each mini-app at the top level *and* under /projects/.
# Apps with a project page live at /projects/<name>/; the small standalone
# ones with no project page live at /misc/<name>/ (listed from content/misc).
# Every old address redirects in.
[[redirects]]
  from = "/dozenal"
  to = "/projects/dozenal/"
  status = 301

[[redirects]]
  from = "/onetimepad"
  to = "/projects/onetimepad/"
  status = 301

[[redirects]]
  from = "/3d2"
  to = "/projects/3d2/"
  status = 301

# Sudoku is its own Netlify project (github.com/bristoljon/sudoku).
# Forced, because the Gatsby build cache can keep the old static copy in
# public/ and an unforced redirect never shadows an existing file.
[[redirects]]
  from = "/sudoku"
  to = "https://sudoku.bristoljon.uk/"
  status = 301

[[redirects]]
  from = "/projects/sudoku"
  to = "https://sudoku.bristoljon.uk/"
  status = 301
  force = true

[[redirects]]
  from = "/projects/sudoku/*"
  to = "https://sudoku.bristoljon.uk/"
  status = 301
  force = true

# Misc apps: bare paths, old /projects/ paths (with and without the
# trailing slash, and anything beneath), all to /misc/<name>/.
[[redirects]]
  from = "/drinkscalc"
  to = "/misc/drinkscalc/"
  status = 301

[[redirects]]
  from = "/projects/drinkscalc"
  to = "/misc/drinkscalc/"
  status = 301

[[redirects]]
  from = "/projects/drinkscalc/*"
  to = "/misc/drinkscalc/:splat"
  status = 301

[[redirects]]
  from = "/suncalc"
  to = "/misc/suncalc/"
  status = 301

[[redirects]]
  from = "/projects/suncalc"
  to = "/misc/suncalc/"
  status = 301

[[redirects]]
  from = "/projects/suncalc/*"
  to = "/misc/suncalc/:splat"
  status = 301

[[redirects]]
  from = "/shader"
  to = "/misc/shader/"
  status = 301

[[redirects]]
  from = "/projects/shader"
  to = "/misc/shader/"
  status = 301

[[redirects]]
  from = "/projects/shader/*"
  to = "/misc/shader/:splat"
  status = 301

[[redirects]]
  from = "/taptimer"
  to = "/misc/taptimer/"
  status = 301

[[redirects]]
  from = "/projects/taptimer"
  to = "/misc/taptimer/"
  status = 301

[[redirects]]
  from = "/projects/taptimer/*"
  to = "/misc/taptimer/:splat"
  status = 301

[[redirects]]
  from = "/stylechanger"
  to = "/misc/stylechanger/"
  status = 301

[[redirects]]
  from = "/projects/stylechanger"
  to = "/misc/stylechanger/"
  status = 301

[[redirects]]
  from = "/projects/stylechanger/*"
  to = "/misc/stylechanger/:splat"
  status = 301

[[redirects]]
  from = "/spoof"
  to = "/misc/spoof/"
  status = 301

[[redirects]]
  from = "/projects/spoof"
  to = "/misc/spoof/"
  status = 301

[[redirects]]
  from = "/projects/spoof/*"
  to = "/misc/spoof/:splat"
  status = 301

[[redirects]]
  from = "/touchtimer/*"
  to = "/misc/taptimer/"
  status = 301

# Pre-.htaccess URLs, and old links that pointed nowhere.
[[redirects]]
  from = "/projects"
  to = "/project/"
  status = 301

[[redirects]]
  from = "/blog/index.php"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/project/index.php"
  to = "/project/"
  status = 301

[[redirects]]
  from = "/imedic"
  to = "/project/imedic/"
  status = 301

[[redirects]]
  from = "/project/drinkscalc"
  to = "/misc/drinkscalc/"
  status = 301

# Router Spy never had a page; the blog post that describes it will do.
[[redirects]]
  from = "/project/routerspy"
  to = "/blog/update-2/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The 3D viewer works by nesting the site in iframes, so it needs its own
# frame policy rather than the site-wide SAMEORIGIN.
[[headers]]
  for = "/projects/3d2/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
