backend:
  name: git-gateway
  branch: main

# Uncomment while running `npm run cms` alongside `npm run develop` to edit
# against the working tree instead of GitHub.
# local_backend: true

media_folder: static/img/uploads
public_folder: /img/uploads

publish_mode: editorial_workflow

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: content/blog
    create: true
    slug: "{{slug}}"
    # Filename is the URL: content/blog/update-1.md -> /blog/update-1.
    # Renaming a file changes a live URL, so rename with care.
    preview_path: "blog/{{slug}}"
    summary: "{{title}} — {{date | date('MMM YYYY')}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, picker_utc: true, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: type, label: Kind, widget: select, options: ["Update", "Geek Blog"], default: "Update", required: false }
      - { name: number, label: Number, widget: number, value_type: int, required: false }
      - { name: excerpt, label: Summary, widget: text, required: false, hint: "Shown on the homepage and in search results." }
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - name: body
        label: Body
        widget: markdown
        hint: >-
          Raw HTML passes through. Wrap deeper passages in
          <div class="tech"> or <div class="pain"> to put them behind the
          detail toggles.
      - name: comments
        label: Archived comments
        label_singular: Comment
        widget: list
        required: false
        default: []
        collapsed: true
        summary: "{{fields.author}} — {{fields.date | date('MMM YYYY')}}"
        hint: >-
          Read-only history from the old comment table. Commenting is closed,
          so nothing new arrives here — delete an entry to take it down.
        fields:
          - { name: id, label: Legacy ID, widget: string, required: false }
          - { name: author, label: Author, widget: string, default: "Anonymous" }
          - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
          - { name: body, label: Comment, widget: text }

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    slug: "{{slug}}"
    preview_path: "project/{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, picker_utc: true, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: excerpt, label: Summary, widget: text, required: false }
      - { name: status, label: Status, widget: select, options: ["Active", "Paused", "Archived", "Idea"], default: "Archived", required: false }
      - { name: image, label: Image, widget: image, required: false }
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - name: links
        label: Links
        widget: list
        required: false
        default: []
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL, widget: string }
      - name: updates
        label: Updates
        label_singular: Update
        widget: list
        required: false
        default: []
        add_to_top: true
        collapsed: true
        summary: "{{fields.date | date('D MMM YYYY')}} — {{fields.title}}"
        hint: >-
          Short dated notes on progress. Each one shows in a timeline on the
          project page and in the homepage's recent feed.
        fields:
          - { name: date, label: Date, widget: datetime, picker_utc: true, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { name: title, label: Title, widget: string }
          - { name: body, label: Body, widget: markdown, minimal: true, buttons: [bold, italic, link, code, bulleted-list], editor_components: [] }
          - { name: approxDate, label: Date is approximate, widget: boolean, default: false, required: false, hint: "Shows as 'c. Month Year'." }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - { name: body, label: Body, widget: markdown }
      - name: comments
        label: Archived comments
        label_singular: Comment
        widget: list
        required: false
        default: []
        collapsed: true
        summary: "{{fields.author}} — {{fields.date | date('MMM YYYY')}}"
        fields:
          - { name: id, label: Legacy ID, widget: string, required: false }
          - { name: author, label: Author, widget: string, default: "Anonymous" }
          - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
          - { name: body, label: Comment, widget: text }

  - name: misc
    label: Misc
    label_singular: Misc entry
    folder: content/misc
    create: true
    slug: "{{slug}}"
    # Each entry lists a static app kept in static/misc/<slug>/ (the filename
    # must match that folder). The CMS edits the listing, not the app.
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, picker_utc: true, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: excerpt, label: Summary, widget: text, required: false }
      - { name: source, label: Source URL, widget: string, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false, required: false }
      - { name: body, label: Body, widget: hidden, required: false }

  - name: pages
    label: Pages
    files:
      - name: home
        label: Homepage
        file: content/pages/home.md
        preview_path: ""
        fields:
          - { name: title, label: Hero heading, widget: string }
          - { name: excerpt, label: Hero strapline, widget: string, required: false }
          - { name: image, label: Hero image, widget: image, required: false }
          - { name: imageCredit, label: Hero image credit, widget: string, required: false }
          - { name: aboutHeading, label: About heading, widget: string, default: "About Me" }
          - { name: body, label: About text, widget: markdown }

      - name: cv
        label: CV
        file: content/pages/cv.md
        preview_path: "cv"
        fields:
          - { name: title, label: Page title, widget: hidden, default: "CV" }
          - { name: name, label: Name, widget: string }
          - { name: headline, label: Headline, widget: string, required: false }
          - { name: location, label: Location, widget: string, required: false }
          - { name: email, label: Email, widget: string, required: false }
          - { name: phone, label: Phone, widget: string, required: false, hint: "Shown publicly on the site and in the PDF. Leave blank to hide." }
          - { name: address, label: Address, widget: string, required: false, hint: "Shown publicly on the site and in the PDF. Leave blank to hide." }
          - { name: website, label: Website, widget: string, required: false }
          - { name: github, label: GitHub URL, widget: string, required: false }
          - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
          - { name: profile, label: Profile, widget: text }
          - { name: skills, label: Tech, widget: list, required: false, default: [] }
          - name: work
            label: Work
            label_singular: Job
            widget: list
            summary: "{{fields.company}}{{fields.aside}} — {{fields.dates}}"
            hint: "Newest first. For a gap between jobs, fill in only 'Aside'."
            fields:
              - { name: company, label: Company, widget: string, required: false }
              - { name: title, label: Role, widget: string, required: false }
              - { name: location, label: Location, widget: string, required: false }
              - { name: dates, label: Dates, widget: string, required: false, hint: "Free text, e.g. May ’24 – present" }
              - { name: url, label: Link, widget: string, required: false }
              - { name: summary, label: Summary, widget: text, required: false }
              - { name: highlights, label: Highlights, widget: list, required: false, default: [] }
              - { name: aside, label: Aside, widget: string, required: false, hint: "Use on its own for an italic line such as a career break." }
          - name: education
            label: Education
            widget: list
            summary: "{{fields.qualification}}"
            fields:
              - { name: qualification, label: Qualification, widget: string }
              - { name: school, label: School, widget: string }
              - { name: year, label: Year, widget: string }
          - name: sideProjects
            label: Projects
            label_singular: Project
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: status, label: Status, widget: string, required: false }
              - { name: description, label: Description, widget: text }
          - { name: sideProjectsNote, label: Projects footnote, widget: string, required: false }
          - { name: body, label: Body, widget: hidden, required: false }
