    <!--
      Netlify Identity is what logs *you* into the CMS. It is not the old site
      log-in: visitors never see it and there is no users table any more.
      Enable Identity on the site in Netlify, set registration to Invite only,
      then enable Git Gateway under Identity > Services.
    -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
